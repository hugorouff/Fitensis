services:
  gym:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - gym_data:/app/var
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?Definissez APP_SECRET dans votre environnement}
      DATABASE_URL: ${DATABASE_URL:?Renseignez la connexion PostgreSQL}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
volumes:
  gym_data:
